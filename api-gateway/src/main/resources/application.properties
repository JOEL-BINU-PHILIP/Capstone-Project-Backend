# ===============================
# Server Configuration
# ===============================
server.port=8080
spring.application.name=api-gateway

# ===============================
# CORS Configuration
# ===============================
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=http://localhost:3000,http://localhost:4200,http://127.0.0.1:3000,http://127.0.0.1:4200
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,PATCH,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].exposedHeaders=Authorization,Content-Type
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].maxAge=3600

# ===============================
# AUTH SERVICE ROUTES (8081)
# ===============================
# Route:  /api/auth/** -> Auth Service
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=http://localhost:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**

# Route: /api/users/** -> Auth Service
spring.cloud.gateway.routes[1].id=auth-users
spring.cloud.gateway.routes[1].uri=http://localhost:8081
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/users/**

# Route: /api/admin/** -> Auth Service
spring.cloud.gateway.routes[2].id=auth-admin
spring.cloud.gateway.routes[2].uri=http://localhost:8081
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/admin/**

# Route: /api/technician-profiles/** -> Auth Service
spring.cloud.gateway.routes[3].id=auth-technicians
spring.cloud.gateway.routes[3].uri=http://localhost:8081
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/technician-profiles/**

# Route: /api/service-manager/** -> Auth Service
spring.cloud.gateway.routes[4].id=auth-service-manager
spring.cloud.gateway.routes[4].uri=http://localhost:8081
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/service-manager/**

# ===============================
# CATALOG SERVICE ROUTES (8082)
# ===============================
# Route: /api/services/** -> Catalog Service
spring.cloud.gateway.routes[5].id=catalog-service
spring.cloud.gateway.routes[5].uri=http://localhost:8082
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/services/**

# ===============================
# BOOKING SERVICE ROUTES (8083)
# ===============================
# Route: /api/bookings/** -> Booking Service
spring.cloud.gateway.routes[6].id=booking-service
spring.cloud.gateway.routes[6].uri=http://localhost:8083
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/bookings/**

# ===============================
# BILLING SERVICE ROUTES (8084)
# ===============================
# Route: /api/billing/** -> Billing Service
spring.cloud.gateway.routes[7].id=billing-service
spring.cloud.gateway.routes[7].uri=http://localhost:8084
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/billing/**

# ===============================
# NOTIFICATION SERVICE ROUTES (8085)
# ===============================
# Route: /api/notifications/** -> Notification Service
spring.cloud.gateway.routes[8].id=notification-service
spring.cloud.gateway.routes[8].uri=http://localhost:8085
spring.cloud.gateway.routes[8].predicates[0]=Path=/api/notifications/**

# ===============================
# Actuator Configuration
# ===============================
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.health.show-details=always
management.endpoint.gateway.enabled=true

# ===============================
# Logging Configuration
# ===============================
logging.level.root=INFO
logging.level.com.app.gateway=DEBUG
logging.level.org.springframework.cloud.gateway=INFO

# Logging Pattern
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n