# MongoDB
spring.data.mongodb.uri=mongodb://localhost:27017/auth_db_dev

# Mail (Mailtrap for testing)
spring.mail.host=smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=${MAILTRAP_USERNAME}
spring.mail.password=${MAILTRAP_PASSWORD}

# JWT
jwt.secret=dev-secret-key-for-testing-only-min-32-chars

# Application
app.base-url=http://localhost:8081

# Logging
logging.level.root=INFO
logging.level.com.app.auth=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.data.mongodb=DEBUG
