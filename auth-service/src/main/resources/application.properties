# Application Name
spring.application.name=auth-service

# ===============================
# MongoDB Configuration
# ===============================
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/auth_db}
spring.data.mongodb.auto-index-creation=true

# ===============================
# Mail Configuration - MAILTRAP (Development/Testing)
# ===============================
spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=b8bdbfb879dc1e
spring.mail.password=0ab8961bf223cc
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Old Gmail config (commented out - for future production use)
# spring.mail.host=${MAIL_HOST:smtp.gmail.com}
# spring.mail.port=${MAIL_PORT:587}
# spring.mail.username=${MAIL_USERNAME}
# spring.mail.password=${MAIL_PASSWORD}

# From address for all emails
app.mail.from=no-reply@joel.com

# ===============================
# Thread Pool for Async Operations
# ===============================
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=100

# ===============================
# JWT Configuration
# ===============================
jwt.secret=${JWT_SECRET:Wl+R5gPJafDjV/ywH4JNcnoajisNmmBnEu7ItuCQdYmLW6w8y94+XOs8FDhXfjA2fFBfYejp9EkvhxMRb8DeDA==}
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=2592000000
jwt.temp-token-expiration=300000

# ===============================
# Application Configuration
# ===============================
app.base-url=${APP_BASE_URL:http://localhost:8081}

# ===============================
# Security Configuration
# ===============================
app.security.max-login-attempts=5
app.security.account-lock-duration-minutes=30
app.security.max-refresh-tokens-per-user=5
app.security.email-verification-token-expiry-hours=24
app.security.password-reset-token-expiry-hours=1

# Rate Limiting
app.security.max-login-attempts-per-username=10
app.security.max-login-attempts-per-ip=20
app.security.rate-limit-window-minutes=15

# ===============================
# Actuator Configuration
# ===============================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.metrics.tags.application=${spring.application.name}

# ===============================
# Logging Configuration
# ===============================
logging.level.root=INFO
logging.level.com.app.auth=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.data.mongodb=DEBUG

# Logging Pattern
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Logging File
logging.file.name=logs/auth-service.log
logging.file.max-size=10MB
logging.file.max-history=30

# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}
# ===============================
# Server Configuration
# ===============================
server.port=8081
server.error.include-message=always
server.error.include-binding-errors=always