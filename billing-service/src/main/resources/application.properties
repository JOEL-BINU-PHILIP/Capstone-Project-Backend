# ===============================
# Application Configuration
# ===============================
spring.application.name=billing-service
server.port=8084

# ===============================
# MongoDB Configuration
# ===============================
spring.data.mongodb.uri=mongodb://localhost:27017/billing_db
spring.data.mongodb.auto-index-creation=true

# ===============================
# JWT Configuration
# ===============================
jwt.secret=${JWT_SECRET:Wl+R5gPJafDjV/ywH4JNcnoajisNmmBnEu7ItuCQdYmLW6w8y94+XOs8FDhXfjA2fFBfYejp9EkvhxMRb8DeDA==}

# ===============================
# RabbitMQ Configuration (ADD THIS)
# ===============================
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# ===============================
# Logging Configuration
# ===============================
logging.level.root=INFO
logging.level.com.app.billing=DEBUG

# ===============================
# Actuator Configuration
# ===============================
management.endpoints.web.exposure.include=health,info

# ===============================
# Server Error Configuration
# ===============================
server.error.include-message=always
server.error.include-binding-errors=always