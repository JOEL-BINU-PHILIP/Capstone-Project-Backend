# ===============================
# Application Configuration
# ===============================
spring.application.name=booking-service
server.port=8083

# ===============================
# MongoDB Configuration
# ===============================
spring.data.mongodb.uri=mongodb://localhost:27017/booking_db
spring.data.mongodb.auto-index-creation=true

# ===============================
# RabbitMQ Configuration (ADD THIS)
# ===============================
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq. port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# ===============================
# JWT Configuration
# ===============================
# IMPORTANT: This MUST match the secret used in auth-service
jwt.secret=${JWT_SECRET:Wl+R5gPJafDjV/ywH4JNcnoajisNmmBnEu7ItuCQdYmLW6w8y94+XOs8FDhXfjA2fFBfYejp9EkvhxMRb8DeDA==}

# ===============================
# Eureka Client (Service Discovery)
# ===============================
# Set to true if you want to register with Eureka
eureka.client.enabled=false
# eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
# eureka.instance.prefer-ip-address=true

# ===============================
# Logging Configuration
# ===============================
logging.level.root=INFO
logging.level.com.app.booking=DEBUG
logging.level.org. springframework.security=DEBUG
logging.level.org.springframework.data. mongodb=INFO

# Logging Pattern
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ===============================
# Actuator Configuration
# ===============================
management.endpoints.web.exposure. include=health,info
management.endpoint.health.show-details=when-authorized

# ===============================
# Server Error Configuration
# ===============================
server.error.include-message=always
server.error.include-binding-errors=always